<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review</title>
    <meta name="author" content="Gisele Guzman">
    <meta name="description" content="This is a product review form for WDD 131-Dynamic Web Fundamentals. It includes a dropdown menu, radio buttons, checkboxes, and text inputs.">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>

<header>
    <h1>Product Review</h1>
</header>

<main>
    <form method="get" action="review.html">

        <label for="productName">Product Name *</label>
        <select id="productName" name="productName" required>
            <option value="" disabled selected>
                Select a Product...
            </option>
        </select>

        <fieldset>
            <legend>Overall Rating *</legend>

            <input type="radio" id="star1" name="rating" value="1" required>
            <label for="star1">☆</label>

            <input type="radio" id="star2" name="rating" value="2">
            <label for="star2">☆☆</label>

            <input type="radio" id="star3" name="rating" value="3">
            <label for="star3">☆☆☆</label>

            <input type="radio" id="star4" name="rating" value="4">
            <label for="star4">☆☆☆☆</label>

            <input type="radio" id="star5" name="rating" value="5">
            <label for="star5">☆☆☆☆☆</label>
        </fieldset>

        <label for="installDate">Date of Installation *</label>
        <input
            type="date"
            id="installDate"
            name="installDate"
            required>

        <fieldset>
            <legend>Useful Features</legend>

            <label>
                <input
                    type="checkbox"
                    id="durability"
                    name="features"
                    value="Durability">
                Durability
            </label>

            <label>
                <input
                    type="checkbox"
                    id="ease"
                    name="features"
                    value="Ease of Use">
                Ease of Use
            </label>

            <label>
                <input
                    type="checkbox"
                    id="performance"
                    name="features"
                    value="Performance">
                Performance
            </label>

            <label>
                <input
                    type="checkbox"
                    id="design"
                    name="features"
                    value="Design">
                Design
            </label>
        </fieldset>

        <label for="review">
            Written Review (Optional)
        </label>

        <textarea
            id="review"
            name="review"
            rows="5"></textarea>

        <label for="username">
            Your Name (Optional)
        </label>

        <input
            type="text"
            id="username"
            name="username">

        <input
            type="submit"
            value="Submit Review">

    </form>
</main>

<footer>
    <p>&copy; <span id="year"></span>Gisele Guzman|Argentina</p>
    <p id="lastModified"></p>
</footer>

</body>
</html>
