<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madagascar</title>
    <meta name="description" content="A brief description and presentation of one of the most wonderful countries in the world such as Madagascar">
    <link rel="stylesheet" href="styles/place.css">
    <script src="scripts/place.js" defer></script>
</head>
<body>
    <header>
        <h1>Madagascar</h1>
    </header>
    <main>
        <picture>
            <source
                media="(max-width: 768px)"
                srcset="images/madagascar1.webp">
            <img
                src="images/madagascar2.webp"
                alt="Madagascar">
        
        </picture>
        <section class="data">  
            <h2>Data</h2>

            <p><strong>Area:</strong> 587,041 km²</p>
            <p><strong>Population:</strong> 27,691,018</p>
            <p><strong>Capital:</strong> Antananarivo</p>
            <p><strong>Languages:</strong> Malagasy, French</p>
            <p><strong>Currency:</strong> Ariary</p>
            <p><strong>Time Zone:</strong> UTC+3</p>
            <p><strong>Calling Code:</strong> +261</p>
            <p><strong>Internet TLD:</strong> .mg</p>
        </section>
        <section class="weather">
            <h2>Weather</h2>
            <img 
            src="images/clima1.svg"
            alt="Clima"
            class="weather-icon">

            <p><strong>Temperature:</strong> 10 °C</p>
            <p><strong>Conditions:</strong> Partly Cloudy</p>
            <p><strong>Wind:</strong> 5 km/h</p>
            <p><strong>Wind Chill:</strong>
                <span id="windchill"></span>
            </p>
        </section>

    </main>
    <footer>
        <p>&copy; <span id="year"></span>Gisele Guzman-Madagascar</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
