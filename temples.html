<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Album</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">
    <script src="scripts/temples.js" defer></script>

</head>
<body>
    <header>
        <h1>Temple Album</h1>
        <button id="menubutton">☰</button>
        <nav class="navigation">
            <a href="www.home.com">Home</a>
            <a href="www.old.com">Old</a>
            <a href="www.new.com">New</a>
            <a href="www.large.com">Large</a>
            <a href="www.small.com">Small</a>
        </nav>
    </header>
    <main>
        <h2>Temple Gallery</h2>
        <div class="gallery">
            <figure>
                <img src="images/templo salt-lake-city.webp" alt="Temple 1">
                <figcaption>Salt Lake Temple</figcaption>
            </figure>
            <figure>
                <img src="images/provo.webp" alt="Temple 2">
                <figcaption>Provo Temple</figcaption>
            </figure>
            <figure>
                <img src="images/italy.webp" alt="Temple 3">
                <figcaption>Rome Italy Temple</figcaption>
            </figure>
            <figure>
                <img src="images/mexico.webp" alt="Temple 4">
                <figcaption>Mexico City Temple</figcaption>
            </figure>
            <figure>
                <img src="images/washington.webp" alt="Temple 5">
                <figcaption>Temple Washington D.C</figcaption>
            </figure>
            <figure>
                <img src="images/madrid.webp" alt="Temple 6">
                <figcaption>Madrid Spain Temple</figcaption>
            </figure>
        </div>
    </main>
    <footer>
        <p>&copy;<span id="currentyear"></span>Gisele Guzman, Argentina Buenos Aires
        </p>
        <p id="lastModified"></p>
    </footer>
        
    
</body>
</html>
