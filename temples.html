<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Album</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">
    <script src="scripts/temples.js" defer></script>

</head>
<body>
    <header>>
        <h1>Temple Album</h1>
        <button id="menubutton">☰</button>
        <nav class="navigation">
            <a href="www.home.com">Home</a>
            <a href="www.old.com">Old</a>
            <a href="www.new.com">New</a>
            <a href="www.large.com">Large</a>
            <a href="www.small.com">Small</a>
        </nav>
    </header>
    <main>
        <section class="card">
            <h2>Temple Gallery</h2>
            <div class="gallery">
                <figure>
                    <img src="images/templo salt-lake-city.webp/400x250" alt="Temple 1">
                    <figcaption>Salt Lake Temple</figcaption>
                </figure>
                <figure>
                    <img src="images/temple2.jpg" alt="Temple 2">
                    <figcaption>Provo Temple</figcaption>
                </figure>
                <figure>
                    <img src="images/temple3.jpg" alt="Temple 3">
                    <figcaption>Rome Italy Temple</figcaption>
                </figure>
                <figure>
                    <img src="images/temple4.jpg" alt="Temple 4">
                    <figcaption>Mexico City Temple</figcaption>
                </figure>
            </div>
        </section>
    
</body>
</html>
